name: CI/CD (tests + deploy a cPanel)

# Pipeline completo: push a main dispara 3 jobs de verificación en paralelo
# (backend-tests, php-lint) -> si ambos pasan, corre e2e-smoke (Playwright,
# contra un servidor real + BD migrada/sembrada) -> si eso pasa, recién ahí
# el job de deploy pide aprobación manual (environment "production") y
# sincroniza a cPanel por SSH/rsync.
#
# - NO usa --delete: nunca borra archivos que existan solo en el servidor.
# - config.php / vendor / uploads / sessions estan en .gitignore -> no viajan.
# - migrations/*.sql pendientes se corren solas via remesas_private/scripts/migrate.php
#   (tabla de control _migrations_applied, cada migración se aplica una sola vez).
#
# IMPORTANTE (por que ControlMaster en el job deploy): el hosting cPanel
# bloquea la IP tras la primera conexion SSH (anti-flood CSF/cPHulk), por eso
# el 2do rsync daba "Connection timed out". Con ControlMaster abrimos UNA
# conexion maestra y rsync x2 + composer la REUTILIZAN -> el firewall ve una
# sola conexion.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # JOB 1: Tests de backend (PHPUnit) contra MySQL real.
  # TransactionServiceTest necesita una conexión real (TransactionProofRepository
  # se instancia directo en el constructor de TransactionService, no es
  # mockeable) — por eso hace falta el servicio MySQL, no alcanza con PHP solo.
  # ─────────────────────────────────────────────────────────────────────────
  backend-tests:
    name: Backend (PHPUnit)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: jcenvios_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, mysqli, gd, zip, curl, openssl
          coverage: pcov

      - name: Composer install (con dev, incluye PHPUnit)
        run: cd remesas_private && composer install --optimize-autoloader --no-interaction

      - name: Cargar esquema + catálogo base
        run: |
          mysql -h127.0.0.1 -uroot -proot jcenvios_test < database/schema.sql
          mysql -h127.0.0.1 -uroot -proot jcenvios_test < database/catalog_seed.sql

      - name: Generar config.php de test
        run: |
          cat > remesas_private/config.php <<'EOF'
          <?php
          define('BASE_URL', 'http://127.0.0.1:8899');
          define('SESSION_DOMAIN', '127.0.0.1');
          define('IS_HTTPS', false);
          define('DB_HOST', '127.0.0.1');
          define('DB_USER', 'root');
          define('DB_PASS', 'root');
          define('DB_NAME', 'jcenvios_test');
          define('APP_ENCRYPTION_KEY', '01234567890123456789012345678901');
          define('ADMIN_EMAIL', 'ci@example.test');
          // Host falso a propósito: NotificationService ya atrapa el fallo de
          // conexión SMTP como Exception (catch (Exception $e) { ... return false; }),
          // así que un envío de correo fallido no rompe nada. Lo que sí rompía todo
          // antes era la CONSTANTE INDEFINIDA (Error, no Exception -> no se atrapaba).
          define('SMTP_HOST', 'localhost');
          define('SMTP_USER', 'ci@example.test');
          define('SMTP_PASS', 'ci-fake-password');
          define('SMTP_SECURE', 'tls');
          define('SMTP_PORT', 587);
          EOF

      - name: Correr PHPUnit (200 tests) con coverage
        run: cd remesas_private && vendor/bin/phpunit --colors=always --coverage-html=coverage-html --coverage-clover=coverage.xml

      - name: Subir reporte de coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            remesas_private/coverage-html/
            remesas_private/coverage.xml
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 2: Barrido de sintaxis PHP en todo el repo. No corre PHPUnit ni
  # necesita BD — solo confirma que cada .php parsea. Atrapa exactamente el
  # tipo de bug encontrado en esta sesión (comentario de crontab con "*/N"
  # que rompía el parseo de un cron entero y nunca lo detectó nada más).
  # ─────────────────────────────────────────────────────────────────────────
  php-lint:
    name: Lint de sintaxis PHP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: php -l en todos los archivos .php del repo
        run: |
          find . -name "*.php" \
            -not -path "./remesas_private/vendor/*" \
            -not -path "./node_modules/*" \
            -print0 \
          | xargs -0 -n1 -P4 php -l

  # ─────────────────────────────────────────────────────────────────────────
  # JOB: Auditoría de dependencias (composer audit + npm audit). No bloquea
  # el pipeline todavía (continue-on-error) — solo reporta vulnerabilidades
  # conocidas en el log del run. Cuando el equipo esté cómodo con los falsos
  # positivos, sacar continue-on-error para que bloquee el merge.
  # ─────────────────────────────────────────────────────────────────────────
  dependency-audit:
    name: Auditoría de dependencias (composer + npm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Composer install (con dev)
        run: cd remesas_private && composer install --optimize-autoloader --no-interaction

      - name: composer audit
        continue-on-error: true
        run: cd remesas_private && composer audit --format=table

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: npm install
        run: npm install

      - name: npm audit
        continue-on-error: true
        run: npm audit --audit-level=high

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 3: Smoke + flujo de negocio crítico con Playwright, contra un
  # servidor PHP real y una BD recién migrada + sembrada (schema + catálogo
  # + usuarios/tasa/beneficiario de prueba en database/ci_test_seed.sql).
  # ─────────────────────────────────────────────────────────────────────────
  e2e-smoke:
    name: E2E smoke (Playwright)
    needs: [backend-tests, php-lint]
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: jcenvios_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, mysqli, gd, zip, curl, openssl
          coverage: none

      - name: Composer install (sin dev, como en producción)
        run: cd remesas_private && composer install --no-dev --optimize-autoloader --no-interaction

      - name: Cargar esquema + catálogo + seed de datos de prueba
        run: |
          mysql -h127.0.0.1 -uroot -proot jcenvios_test < database/schema.sql
          mysql -h127.0.0.1 -uroot -proot jcenvios_test < database/catalog_seed.sql
          mysql -h127.0.0.1 -uroot -proot jcenvios_test < database/ci_test_seed.sql

      - name: Generar config.php apuntando al servidor de prueba
        run: |
          cat > remesas_private/config.php <<'EOF'
          <?php
          define('BASE_URL', 'http://127.0.0.1:8899');
          define('SESSION_DOMAIN', '127.0.0.1');
          define('IS_HTTPS', false);
          define('DB_HOST', '127.0.0.1');
          define('DB_USER', 'root');
          define('DB_PASS', 'root');
          define('DB_NAME', 'jcenvios_test');
          define('APP_ENCRYPTION_KEY', '01234567890123456789012345678901');
          define('ADMIN_EMAIL', 'ci@example.test');
          // Host falso a propósito: NotificationService ya atrapa el fallo de
          // conexión SMTP como Exception (catch (Exception $e) { ... return false; }),
          // así que un envío de correo fallido no rompe nada. Lo que sí rompía todo
          // antes era la CONSTANTE INDEFINIDA (Error, no Exception -> no se atrapaba).
          define('SMTP_HOST', 'localhost');
          define('SMTP_USER', 'ci@example.test');
          define('SMTP_PASS', 'ci-fake-password');
          define('SMTP_SECURE', 'tls');
          define('SMTP_PORT', 587);
          EOF

      - name: Levantar servidor PHP de prueba
        run: |
          php -S 127.0.0.1:8899 -t public_html > /tmp/php-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:8899/login.php && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:8899/login.php || (cat /tmp/php-server.log && exit 1)

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias de test e2e
        run: npm install

      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps chromium

      - name: Correr tests e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:8899
        run: npx playwright test

      - name: Subir reporte de Playwright (si falló)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Log del servidor PHP (si falló)
        if: failure()
        run: cat /tmp/php-server.log || true

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 4: Deploy a producción — solo si los 3 jobs anteriores pasaron.
  # Espera además APROBACIÓN MANUAL (environment "production").
  # ─────────────────────────────────────────────────────────────────────────
  # ─────────────────────────────────────────────────────────────────────────
  # JOB 4: Despliegue a cPanel. SOLO se ejecuta con disparo manual
  # (workflow_dispatch), nunca con un push a main.
  #
  # Por qué: la aprobación manual antes se apoyaba en el "required reviewer"
  # del environment `production`, pero esa protección NO está activa — la API
  # la rechaza con 422 ("Please ensure the billing plan supports the required
  # reviewers protection rule") porque el repositorio es privado y la cuenta
  # está en el plan Free. Es decir: durante semanas los push a main
  # desplegaron solos aunque se creyera lo contrario.
  #
  # Con este `if`, un push a main corre los cuatro jobs de verificación y se
  # detiene ahí. Para publicar: pestaña Actions -> "CI/CD (tests + deploy a
  # cPanel)" -> "Run workflow" sobre la rama main. Eso vuelve a correr los
  # tests y recién entonces despliega.
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: Sync a cPanel (SSH multiplexado)
    needs: e2e-smoke
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout (solo archivos versionados)
        uses: actions/checkout@v4

      - name: Cargar clave SSH privada
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Configurar SSH multiplexado (una sola conexion)
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          cat > ~/.ssh/config <<EOF
          Host deploy
            HostName ${{ secrets.SSH_HOST }}
            Port ${{ secrets.SSH_PORT || 22 }}
            User ${{ secrets.SSH_USER }}
            StrictHostKeyChecking accept-new
            ControlMaster auto
            ControlPath ~/.ssh/cm-deploy.sock
            ControlPersist 10m
            ServerAliveInterval 30
          EOF
          chmod 600 ~/.ssh/config
          # Abrir la conexion maestra UNA sola vez. rsync y composer la reutilizan.
          ssh -fN deploy
          echo "Conexion maestra establecida."

      # ── Migraciones ANTES del codigo ──────────────────────────────────────
      #
      # El rsync no es atomico: mientras corre, el sitio sigue sirviendo
      # peticiones. Si el codigo nuevo llega antes que el esquema, hay una
      # ventana de decenas de segundos en la que consulta columnas y tablas que
      # todavia no existen, y cada peticion que las toque devuelve un 500.
      # Migrando primero, la ventana la atraviesa el codigo VIEJO contra el
      # esquema nuevo, que es la unica de las dos combinaciones que se puede
      # hacer segura.
      #
      # A cambio, esto le impone una regla a las migraciones: tienen que ser
      # compatibles hacia atras con el codigo que todavia esta corriendo. En la
      # practica, agregar columnas, tablas e indices es seguro; renombrar o
      # borrar algo que el codigo viejo aun usa NO lo es. Para esos casos hay que
      # partirlo en dos despliegues (primero agregar y empezar a escribir en lo
      # nuevo, despues borrar lo viejo).
      #
      # Solo se sube migrations/ en este punto, no remesas_private/: los crons
      # viven ahi y desplegarlos antes que el src/ del que dependen los dejaria
      # fallando si alguno se dispara durante la ventana. El migrate.php que se
      # ejecuta es el que ya esta en el servidor del despliegue anterior; si
      # alguna vez cambia el runner en si, ese cambio recien tiene efecto en el
      # despliegue siguiente.
      - name: Desplegar migrations/  (antes de tocar el codigo)
        run: |
          rsync -rltvz --no-perms --no-owner --no-group \
            --exclude '.git*' \
            migrations/ deploy:migrations/

      # Corre migrations/*.sql pendientes contra la BD de prod, en orden, cada
      # una una sola vez (tabla de control _migrations_applied). Usa las
      # credenciales de remesas_private/config.php ya presentes en el
      # servidor (no viajan secretos de BD por este pipeline). Si una
      # migración falla, el step falla y el codigo nuevo NO se despliega: la
      # aplicacion sigue entera con la version anterior.
      - name: Correr migraciones de BD pendientes
        run: ssh deploy 'php ~/remesas_private/scripts/migrate.php'

      # Fuerza la actualización del Service Worker (PWA) en cada deploy.
      #
      # sw.js nunca cambiaba de bytes entre despliegues (CACHE_NAME era un
      # string fijo), así que el navegador nunca detectaba una versión nueva
      # del worker: los activos precacheados (bootstrap, style.css, el logo)
      # quedaban servidos desde caché para siempre en cualquiera que tuviera
      # la PWA instalada — ni Ctrl+F5 lo soluciona, el service worker vive
      # fuera del ciclo normal de caché del navegador. Se sustituye acá, en el
      # checkout del runner, NUNCA en el repo (evita el problema de "el commit
      # que agrega su propio SHA no puede conocerlo de antemano").
      - name: Forzar actualización del Service Worker
        run: |
          sed -i "s/__BUILD_ID__/${GITHUB_SHA:0:12}/" public_html/sw.js
          grep -n "CACHE_NAME = " public_html/sw.js

      - name: Desplegar public_html/  (document root)
        run: |
          rsync -rltvz --no-perms --no-owner --no-group \
            --exclude '.git*' \
            --exclude 'uploads/' \
            --exclude 'temp_orders/' \
            --exclude '*.log' \
            --exclude 'error_log' \
            public_html/ deploy:public_html/

      - name: Desplegar remesas_private/  (logica privada, fuera del docroot)
        run: |
          rsync -rltvz --no-perms --no-owner --no-group \
            --exclude '.git*' \
            --exclude 'config.php' \
            --exclude 'vendor/' \
            --exclude 'sessions/' \
            --exclude 'locks/' \
            --exclude 'uploads/' \
            --exclude 'tests/' \
            --exclude 'phpunit.xml' \
            --exclude '.phpunit.result.cache' \
            --exclude '*.log' \
            remesas_private/ deploy:remesas_private/

      - name: Instalar dependencias en el servidor (composer, sin dev)
        run: |
          ssh deploy 'cd ~/remesas_private && { command -v composer >/dev/null 2>&1 && composer install --no-dev --optimize-autoloader --no-interaction || php composer.phar install --no-dev --optimize-autoloader --no-interaction; }'

      - name: Cerrar conexion maestra
        if: always()
        run: ssh -O exit deploy 2>/dev/null || true
